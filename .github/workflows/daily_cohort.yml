
name: Freeze daily cohort and update T-plus

on:
  workflow_dispatch:
  schedule:
    # 09:45 UTC = 16:45 Vietnam time, weekdays
    - cron: "45 9 * * 1-5"

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas numpy yfinance pyarrow

      - run: python daily_cohort_worker.py

      - name: Commit ledger changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_cohorts.csv paper_marks.csv paper_t10_summary.csv
          if git diff --cached --quiet; then
            echo "No cohort or T+ changes"
          else
            git commit -m "Update frozen cohort and T-plus marks"
            git push
          fi
